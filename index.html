<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#FFFFFF">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="HK Entretiens">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png?v=2">
<link rel="icon" href="icon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- police chargée sans bloquer l'affichage (réseau faible) -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<title>HK Entretiens</title>
<style>
/* HK TERRASSEMENT — ENTRETIENS DU PARC */
:root{
  --bg:#F3F5F9; --bg-2:#EEF1F6; --panel:#FFFFFF; --panel-2:#F6F8FB; --panel-3:#E4E8EF;
  --line:#E1E5EC; --line-2:#CDD3DD;
  --tx:#14213D; --tx-2:#3D4A63; --tx-3:#5B6577;
  --yel:#1E5BD8; --yel-2:#3B74E6; --yel-ink:#FFFFFF; --yel-dim:#E6EEFC;
  --red:#C62A1F; --red-dim:#FDE8E6;
  --amb:#D97706; --amb-dim:#FFF1DA;
  --grn:#1E8E4E; --grn-dim:#E3F4EA;
  --blu:#1E5BD8; --blu-dim:#E6EEFC;
  --gry:#7B8494; --gry-dim:#EEF1F5;
  --cond:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --sans:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,sans-serif;
  --r:12px; --ease:cubic-bezier(.2,.8,.2,1);
  --sh:0 1px 2px rgba(20,33,61,.06),0 4px 14px -6px rgba(20,33,61,.10);
  --st:env(safe-area-inset-top); --sbm:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0;padding:0;min-height:100%}
html{background:#F3F5F9}
body{background:var(--bg);color:var(--tx);font:500 16px/1.45 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--yel);outline-offset:2px}
[hidden]{display:none!important}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.cond{font-family:var(--cond);}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:square;stroke-linejoin:miter;flex:0 0 auto}
@keyframes in{from{opacity:0}to{opacity:1}}
@keyframes blink{50%{opacity:.35}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slide{from{background-position:0 0}to{background-position:28px 0}}

/* ---------- en-tête ---------- */
.hd{position:fixed;top:0;left:0;right:0;z-index:40;background-color:#FFFFFF;border-bottom:1px solid var(--line);padding-top:var(--st)}
.hd .bar{display:flex;align-items:center;gap:12px;height:58px;padding:0 16px;max-width:1180px;margin:0 auto}
.mark{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.mark .hk{width:40px;height:40px;flex:0 0 40px;border-radius:10px;border:1px solid var(--line);background:#fff;object-fit:contain}
.mark .t{min-width:0}
.mark .t b{display:block;font:800 21px/1 var(--cond);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mark .t small{display:block;font:600 12.5px/1 var(--sans);color:var(--tx-3);margin-top:4px}
.back{width:40px;height:40px;flex:0 0 40px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line-2);border-radius:var(--r);color:var(--tx)}
.back:active{background:var(--panel-2)}
.hbtn{position:relative;width:40px;height:40px;flex:0 0 40px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line-2);border-radius:var(--r);color:var(--tx-2)}
.hbtn .dot{position:absolute;top:7px;right:7px;width:7px;height:7px;background:var(--yel);border-radius:50%}
.tabs{display:flex;max-width:1180px;margin:0 auto;padding:0 8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:1 0 auto;display:flex;align-items:center;justify-content:center;gap:7px;height:44px;padding:0 12px;text-decoration:none;color:var(--tx-3);
  font:700 15px/1 var(--cond);border-bottom:3px solid transparent;transition:color .15s}
.tabs a.on{color:var(--tx);border-bottom-color:var(--yel)}
.tabs a .n{font:700 11px/1 var(--mono);padding:3px 5px;border-radius:9px;background:var(--red);color:#fff;letter-spacing:0}
.tabs a .n.a{background:var(--amb);color:#111}

main{max-width:1180px;margin:0 auto;padding:calc(103px + var(--st)) 18px calc(104px + var(--sbm))}
.view{animation:in .2s var(--ease)}

/* ---------- tableau de bord ---------- */
.score{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);background:var(--panel);margin-top:20px;border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
.score button{padding:14px 14px 12px;text-align:left;border-left:1px solid var(--line);position:relative}
.score button:first-child{border-left:0}
.score button:active{background:var(--panel-2)}
.score b{display:block;font:800 32px/1 var(--mono);letter-spacing:-.04em}
.score span{display:flex;align-items:center;gap:6px;margin-top:8px;font:700 14px/1 var(--cond);color:var(--tx-2)}
.score span i{width:8px;height:8px;display:block}
.score .r b{color:var(--red)} .score .r i{background:var(--red);animation:blink 1.2s steps(2) infinite}
.score .a b{color:var(--amb)} .score .a i{background:var(--amb)}
.score .s b{color:var(--blu)} .score .s i{background:var(--blu)}
.score .z b{color:var(--tx)}
.health{display:flex;align-items:center;gap:12px;margin-top:10px;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
.health .lbl{font:700 12px/1 var(--cond);color:var(--tx-2);white-space:nowrap}
.health .segs{flex:1;display:grid;gap:2px}
.health .segs i{height:12px;display:block;background:var(--panel-3)}
.health .pc{font:700 15px/1 var(--mono);min-width:44px;text-align:right}

.hazard{height:6px;background:repeating-linear-gradient(-45deg,var(--yel) 0 10px,#111 10px 20px);animation:slide 1.6s linear infinite}

.tools{display:flex;gap:10px;margin-top:20px;align-items:center}
.find{flex:1;position:relative}
.find input{width:100%;height:44px;background:var(--panel);border:1px solid var(--line-2);border-radius:var(--r);padding:0 12px 0 40px;font-size:16px;outline:none}
.find input::placeholder{color:var(--tx-3)}
.find input:focus{border-color:var(--yel)}
.find svg{position:absolute;left:12px;top:12px;color:var(--tx-3)}
.filters{display:flex;gap:8px;overflow-x:auto;margin:14px -18px 0;padding:0 18px 2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:0 0 auto;height:34px;padding:0 12px;border:1px solid var(--line-2);border-radius:var(--r);font:700 13.5px/1 var(--cond);color:var(--tx-2);display:flex;align-items:center;gap:7px}
.filters button .c{font:600 11px/1 var(--mono);color:var(--tx-3)}
.filters button.on{background:var(--tx);border-color:var(--tx);color:var(--bg)}
.filters button.on .c{color:#555}

.cap{display:flex;align-items:center;gap:10px;margin:30px 0 12px;font:700 15px/1 var(--cond);color:var(--tx-2)}
.cap::after{content:"";flex:1;height:1px;background:var(--line)}
.cap .c{font:600 11px/1 var(--mono);color:var(--tx-3);order:2}
.cap svg.i{width:16px;height:16px}

/* ligne machine */
.rows{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
@media (min-width:900px){.rows.cols{grid-template-columns:1fr 1fr}}
.m{display:grid;grid-template-columns:5px 1fr auto;align-items:stretch;background:var(--panel);text-align:left;width:100%;min-height:76px;animation:in .2s var(--ease) both}
.m:active{background:var(--panel-2)}
@media (hover:hover){.m:hover{background:var(--panel-2)}}
.m .st{background:var(--gry)}
.m.retard .st{background:var(--red)} .m.bientot .st{background:var(--amb)} .m.ok .st{background:var(--grn)} .m.prog .st{background:var(--blu)}
.m .body{padding:15px 12px 14px 15px;min-width:0}
.m .nm{font:650 16.5px/1.25 var(--sans);text-transform:none;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m .sb{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:14px;color:var(--tx-3);white-space:nowrap;overflow:hidden}
.m .nx{display:flex;align-items:center;gap:8px;margin-top:9px}
.m .nx .lb{font-size:14px;color:var(--tx-2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.m .side{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;padding:12px 14px 11px 6px;gap:8px}
.cnt{font:700 15px/1 var(--mono);color:var(--tx);white-space:nowrap}
.cnt em{font-style:normal;color:var(--tx-3);font-size:11px;margin-left:3px}

.gauge{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;width:90px;flex:0 0 90px}
.gauge i{height:8px;background:var(--panel-3);display:block}
.gauge.ok i.f{background:var(--grn)} .gauge.bientot i.f{background:var(--amb)} .gauge.retard i.f{background:var(--red)} .gauge.inconnu i.f{background:var(--gry)}
.gauge.lg{width:100%;grid-template-columns:repeat(20,1fr)}
.gauge.lg i{height:10px}

.tg{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:3px;font:700 14px/1 var(--cond);white-space:nowrap}
.tg.retard{background:var(--red);color:#fff}
.tg.bientot{background:#F59E0B;color:#2B1700}
.tg.ok{background:var(--grn-dim);color:var(--grn)}
.tg.inconnu{background:var(--gry-dim);color:var(--tx-2)}
.tg.prog{background:var(--blu-dim);color:var(--blu)}
.tg.vgp{background:var(--yel);color:var(--yel-ink)}
.tg.line{border:1px solid var(--line-2);color:var(--tx-2)}

.plate{display:inline-flex;align-items:stretch;height:20px;border-radius:3px;overflow:hidden;background:#F4F4F0;color:#111;font:700 11.5px/20px var(--mono);}
.plate:before{content:"F";background:#1D3E9A;color:#fff;font-size:8px;padding:0 3px;line-height:22px}
.plate span{padding:0 6px}

/* liste d'échéances (tâches) */
.task{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--panel);padding:14px 16px;width:100%;text-align:left;min-height:72px}
.task:active{background:var(--panel-2)}
.task .d{width:50px;text-align:center;border:1px solid var(--line-2);padding:6px 0 5px;border-radius:3px}
.task .d b{display:block;font:700 22px/1 var(--mono);letter-spacing:-.04em}
.task .d small{display:block;font:700 11px/1 var(--cond);color:var(--tx-3);margin-top:3px}
.task .d.retard{border-color:var(--red);color:var(--red)} .task .d.retard small{color:var(--red)}
.task .d.bientot{border-color:var(--amb);color:var(--amb)} .task .d.bientot small{color:var(--amb)}
.task .d.prog{border-color:var(--blu);color:var(--blu)} .task .d.prog small{color:var(--blu)}
.task .t1{display:block;font:650 16.5px/1.25 var(--sans);text-transform:none;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task .t2{display:block;font-size:14px;color:var(--tx-3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task .t2 b{color:var(--tx-2);font-weight:600}

/* ---------- fiche engin ---------- */
.idp{margin-top:16px;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
.idp .top{display:flex;gap:14px;padding:16px;align-items:flex-start}
.idp .ic{width:56px;height:56px;flex:0 0 56px;display:flex;align-items:center;justify-content:center;background:var(--yel-dim);color:var(--yel);border-radius:14px}
.idp .ic svg.i{width:32px;height:32px;stroke-width:1.7}
.idp h1{margin:0;font:700 24px/1.15 var(--sans);letter-spacing:-.02em}
.idp .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;align-items:center}
.idp .ed{margin-left:auto}
.meter{display:grid;grid-template-columns:1fr auto;align-items:end;gap:12px;border-top:1px solid var(--line);padding:14px 16px;background:var(--bg-2)}
.meter small{display:block;font:700 12px/1 var(--cond);color:var(--tx-3)}
.meter .v{font:700 40px/1 var(--mono);letter-spacing:-.05em;margin-top:8px;display:flex;align-items:baseline;gap:4px}
.meter .v em{font-style:normal;font-size:15px;color:var(--tx-3);letter-spacing:0}
.meter .mnote{font-size:12px;color:var(--tx-3);margin-top:6px}
.odo{display:inline-flex;gap:2px}
.odo span{display:inline-block;min-width:.72em;text-align:center;background:var(--panel-2);border:1px solid var(--line-2);padding:4px 2px;border-radius:6px}

.stabs{display:grid;grid-template-columns:repeat(4,1fr);margin-top:14px;border:1px solid var(--line);position:sticky;top:calc(103px + var(--st));z-index:5;background:var(--bg)}
.stabs button{height:42px;font:700 14px/1 var(--cond);color:var(--tx-3);border-left:1px solid var(--line)}
.stabs button:first-child{border-left:0}
.stabs button.on{background:var(--tx);color:var(--bg)}

.svc{background:var(--panel);border:1px solid var(--line);margin-top:14px;animation:in .2s var(--ease) both;border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
.svc .h{display:flex;align-items:center;gap:10px;padding:12px 14px 0}
.svc .h .ti{flex:1;min-width:0}
.svc .h .ti b{display:block;font:650 16.5px/1.25 var(--sans);text-transform:none;letter-spacing:-.01em}
.svc .h .ti small{display:block;font-size:12px;color:var(--tx-3);margin-top:2px}
.svc .ico{width:34px;height:34px;flex:0 0 34px;border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center;color:var(--tx-2);border-radius:3px}
.svc .ico svg.i{width:18px;height:18px}
.svc .g{padding:12px 14px 4px}
.svc .kv2{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-top:1px solid var(--line);margin-top:10px}
.svc .kv2 div{background:var(--panel);padding:9px 14px}
.svc .kv2 small{display:block;font:700 11px/1 var(--cond);color:var(--tx-3)}
.svc .kv2 b{display:block;font:700 14px/1.2 var(--mono);margin-top:5px;letter-spacing:-.02em}
.svc .acts{display:grid;grid-template-columns:1fr 1fr auto;border-top:1px solid var(--line)}
.svc .acts button{height:44px;display:flex;align-items:center;justify-content:center;gap:7px;font:700 14px/1 var(--cond);color:var(--tx-2);border-left:1px solid var(--line)}
.svc .acts button:first-child{border-left:0;color:var(--yel)}
.svc .acts button:last-child{width:48px}
.svc .acts button:active{background:var(--panel-2)}
.svc .msg{padding:10px 14px 0;font-size:13px;color:var(--tx-3)}

.log{border:1px solid var(--line);margin-top:10px;border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
.log .e{display:grid;grid-template-columns:86px 1fr;gap:0;border-top:1px solid var(--line);background:var(--panel);width:100%;text-align:left}
.log .e:first-child{border-top:0}
.log .e:active{background:var(--panel-2)}
.log .e .w{padding:12px 10px 12px 14px;border-right:1px solid var(--line)}
.log .e .w b{display:block;font:700 13px/1.2 var(--mono)}
.log .e .w small{display:block;font:600 11px/1.2 var(--mono);color:var(--tx-3);margin-top:3px}
.log .e .x{padding:12px 14px;min-width:0}
.log .e .x b{display:block;font:650 16.5px/1.25 var(--sans);text-transform:none;letter-spacing:-.01em}
.log .e .x .p{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.log .e .x .p span{font-size:11.5px;font-weight:600;color:var(--tx-2);border:1px solid var(--line-2);padding:2px 6px;border-radius:3px}
.log .e .x .m2{font-size:12px;color:var(--tx-3);margin-top:6px}

.spec{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);margin-top:10px;border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
.spec div{background:var(--panel);padding:11px 14px}
.spec small{display:block;font:700 11px/1 var(--cond);color:var(--tx-3)}
.spec b{display:block;margin-top:5px;font-weight:600;font-size:14.5px;word-break:break-word}

/* ---------- agenda ---------- */
.mhead{display:flex;align-items:center;gap:8px;margin-top:16px}
.mhead h2{flex:1;margin:0;font:800 26px/1 var(--cond);}
.mhead button{width:40px;height:40px;border:1px solid var(--line-2);border-radius:var(--r);display:flex;align-items:center;justify-content:center}
.mhead .auj{width:auto;padding:0 12px;font:700 13px/1 var(--cond);}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-top:12px;border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
.grid .dw{background:var(--bg-2);text-align:center;padding:7px 0;font:700 11.5px/1 var(--cond);color:var(--tx-3)}
.grid .dd{background:var(--panel);min-height:56px;padding:5px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;position:relative}
.grid .dd.out{background:var(--bg-2);color:var(--tx-3)}
.grid .dd .n{font:700 13px/1 var(--mono)}
.grid .dd.today .n{background:var(--yel);color:var(--yel-ink);padding:3px 4px;margin:-3px}
.grid .dd.sel{outline:2px solid var(--tx);outline-offset:-2px;z-index:1}
.grid .dd .ds{display:flex;flex-wrap:wrap;gap:2px}
.grid .dd .ds i{width:7px;height:7px;display:block}
.grid .dd .ds i.retard{background:var(--red)} .grid .dd .ds i.bientot{background:var(--amb)} .grid .dd .ds i.ok{background:var(--grn)} .grid .dd .ds i.prog{background:var(--blu)}
.grid .dd .k{position:absolute;right:5px;bottom:5px;font:700 11px/1 var(--mono);color:var(--tx-2)}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;font-size:11.5px;color:var(--tx-3)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;display:block}

/* ---------- stock ---------- */
.sk{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:var(--panel);padding:14px 12px 14px 16px}
.sk.low{background:linear-gradient(90deg,var(--red-dim),var(--panel) 55%)}
.sk .tx{min-width:0;text-align:left}
.sk .tx b{display:block;font:650 16.5px/1.25 var(--sans);text-transform:none;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sk .tx small{display:block;font-size:12px;color:var(--tx-3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qty{display:grid;grid-template-columns:42px 62px 42px;height:44px;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden}
.qty button{font:600 22px/1 var(--mono);color:var(--tx-2);display:flex;align-items:center;justify-content:center}
.qty button:active{background:var(--panel-3)}
.qty b{display:flex;flex-direction:column;align-items:center;justify-content:center;border-left:1px solid var(--line-2);border-right:1px solid var(--line-2);font:700 16px/1 var(--mono);background:var(--panel-2)}
.qty b small{font:600 9.5px/1 var(--mono);color:var(--tx-3);margin-top:3px}
.qty.low b{color:var(--red)}

/* ---------- barre d'action ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:50;background-color:#FFFFFF;border-top:1px solid var(--line);padding:10px 16px calc(10px + var(--sbm))}
@media (display-mode:standalone){.dock{padding-bottom:max(22px,calc(10px + var(--sbm)))}main{padding-bottom:calc(118px + var(--sbm))}}
.dock .in{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 16px;border-radius:var(--r);border:1px solid var(--line-2);
  font:700 16px/1 var(--cond);color:var(--tx);transition:transform .1s}
.btn:active{transform:translateY(1px);background:var(--panel-2)}

#splash{position:fixed;inset:0;z-index:500;background:#FFFFFF;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;transition:opacity .3s ease-out,visibility .3s}

/* Réseau de chantier (4G faible) : une demande bloquée est abandonnée au bout
   de 5 s ; une lecture est retentée 2 fois avant d'afficher une erreur. */
async function envoi(url, opt) {
  const essais = (opt.method || "GET") === "GET" ? 3 : 1;
  for (let k = 1; ; k++) {
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 5000);
    try { return await fetch(url, Object.assign({ cache: "no-store", signal: ctl.signal }, opt)); }
    catch (e) { if (k >= essais) throw new Error("Pas de connexion"); await new Promise(r => setTimeout(r, 400 * k)); }
    finally { clearTimeout(t); }
  }
}
const SB = {
  base: () => CFG.supabaseUrl.replace(/\/+$/, ""),
  async auth(corps, type) {
    const r = await fetch(SB.base() + "/auth/v1/token?grant_type=" + type, {
      method: "POST", headers: { apikey: CFG.supabaseKey, "Content-Type": "application/json" }, body: JSON.stringify(corps) });
    return r.ok ? r.json() : null;
  },
  async q(chemin, opt = {}, rejoue) {
    const h = { apikey: CFG.supabaseKey, Authorization: "Bearer " + (session ? session.accessToken : CFG.supabaseKey), "Content-Type": "application/json" };
    if (opt.prefer) h.Prefer = opt.prefer;
    const r = await envoi(SB.base() + "/rest/v1/" + chemin, { method: opt.method || "GET", headers: h, body: opt.body ? JSON.stringify(opt.body) : undefined });
    if (r.status === 401 && !rejoue && session && session.refreshToken) {
      const n = await SB.auth({ refresh_token: session.refreshToken }, "refresh_token");
      if (n && n.access_token) {
        session.accessToken = n.access_token; session.refreshToken = n.refresh_token;
        localStorage.setItem(CLE_SESSION, JSON.stringify(session));
        return SB.q(chemin, opt, true);
      }
      deconnexion(); throw new Error("Session expirée");
    }
    if (!r.ok) { let m = "Erreur " + r.status; try { const j = await r.json(); m = j.message || m; } catch (e) {} throw new Error(m); }
    if (r.status === 204) return null;
    const t = await r.text(); return t ? JSON.parse(t) : null;
  }
};

const Store = {
  demo: false,
  local() { try { return JSON.parse(localStorage.getItem(CLE_DEMO)) || null; } catch (e) { return null; } },
  saveLocal(db) { try { localStorage.setItem(CLE_DEMO, JSON.stringify(db)); } catch (e) {} },
  async all(t) {
    if (this.demo) return (this.local() || {})[t] || [];
    return SB.q(t + "?select=*");
  },
  async ins(t, row) {
    if (this.demo) { const db = this.local(); db[t].push(row); this.saveLocal(db); return row; }
    const r = await SB.q(t, { method: "POST", body: row, prefer: "return=representation" }); return r[0];
  },
  async upd(t, id, patch) {
    if (this.demo) { const db = this.local(); const x = db[t].find(r => r.id === id); Object.assign(x, patch); this.saveLocal(db); return x; }
    const r = await SB.q(t + "?id=eq." + id, { method: "PATCH", body: patch, prefer: "return=representation" }); return r[0];
  },
  async del(t, id) {
    if (this.demo) { const db = this.local(); db[t] = db[t].filter(r => r.id !== id); this.saveLocal(db); return; }
    await SB.q(t + "?id=eq." + id, { method: "DELETE" });
  }
};

let ETATS = [];
function recalc() {
  const auj = E.aujourdhui();
  const taux = {};
  for (const e of S.engins) taux[e.id] = E.tauxJour(S.releves.filter(r => r.engin_id === e.id), auj);

  const actifs = new Map(S.engins.filter(e => e.actif !== false).map(e => [e.id, e]));
  ETATS = S.plans.filter(p => actifs.has(p.engin_id)).map(p => {
    const e = actifs.get(p.engin_id);
    return { plan: p, engin: e, etat: E.calculer(p, e, taux[e.id], auj) };
  });
  garderCopie();
}
const etatsDe = id => ETATS.filter(x => x.engin.id === id).sort(triEtat);
function triEtat(a, b) {
  const o = E.ORDRE[a.etat.statut] - E.ORDRE[b.etat.statut]; if (o) return o;
  const ja = a.etat.resteJours == null ? 1e9 : a.etat.resteJours, jb = b.etat.resteJours == null ? 1e9 : b.etat.resteJours;
  return ja - jb;
}

  if (st === "inconnu") return `<span class="tg inconnu">À compléter</span>`;

  const txt = st === "retard" && (s.resteJours == null || s.resteJours >= 0) ? "Dépassé" : rel(s.resteJours) || LIB[st];
  return `<span class="tg ${st}">${esc(txt.charAt(0).toUpperCase() + txt.slice(1))}</span>`;
}
function jauge(x, lg) {
  const n = lg ? 20 : 10, st = x ? x.etat.statut : "inconnu";
  const f = !x || st === "inconnu" ? 0 : Math.min(n, Math.max(1, Math.round(x.etat.progression * n)));
  return `<span class="gauge ${lg ? "lg " : ""}${st}" aria-hidden="true">${Array.from({ length: n }, (_, k) => `<i class="${k < f ? "f" : ""}"></i>`).join("")}</span>`;
}
function echeanceTxt(x) {

  if (s.echeance) out.push(fmtD(s.echeance));
  return out.join(" · ");
}

}

    const bar = $("#splBar");

    const sp = $("#splash"); if (!sp) return;

  };
  setTimeout(fin, 8000);   // connexion lente : on montre l'app quand même

}

function vueAgenda() {
  const auj = E.aujourdhui();
  if (!UI.mois) UI.mois = { a: auj.getUTCFullYear(), m: auj.getUTCMonth() };
  if (!UI.jour) UI.jour = E.iso(auj);
  entete("Agenda", "");
  const dateDe = x => x.plan.programme_le || (x.etat.echeance ? E.iso(x.etat.statut === "retard" ? auj : x.etat.echeance) : null);
  const parJour = {};
  ETATS.forEach(x => { if (x.etat.statut === "inconnu" && !x.plan.programme_le) return; const d = dateDe(x); if (d) (parJour[d] = parJour[d] || []).push(x); });
  const { a, m } = UI.mois, premier = new Date(Date.UTC(a, m, 1)), decal = (premier.getUTCDay() + 6) % 7;
  const debut = E.ajouterJours(premier, -decal), cases = [];
  for (let k = 0; k < 42; k++) { const d = E.ajouterJours(debut, k); if (k >= 35 && d.getUTCMonth() !== m) break; cases.push(d); }
  const retard = ETATS.filter(x => x.etat.statut === "retard" && !x.plan.programme_le);
  const inconnus = ETATS.filter(x => x.etat.statut === "inconnu");
  const nomMois = premier.toLocaleDateString("fr-FR", { month: "long", year: "numeric", timeZone: "UTC" });

let pile = [];
function ouvrir(titre, sur, corps, pied, monter) {
  const bg = document.createElement("div"); bg.className = "pnl-bg";
  const p = document.createElement("div"); p.className = "pnl"; p.setAttribute("role", "dialog"); p.setAttribute("aria-modal", "true"); p.setAttribute("aria-label", titre);
  p.innerHTML = `<div class="ph"><button class="back" data-x aria-label="Fermer">${ico("backa")}</button><div style="flex:1;min-width:0">${sur ? `<small>${esc(sur)}</small>` : ""}<h3>${esc(titre)}</h3></div></div>
    <div class="pb">${corps}</div>${pied ? `<div class="pf">${pied}</div>` : ""}`;
  document.body.append(bg, p); document.body.style.overflow = "hidden";
  requestAnimationFrame(() => { bg.classList.add("on"); p.classList.add("on"); });
  const fermer = () => {
    bg.classList.remove("on"); p.classList.remove("on");
    setTimeout(() => { bg.remove(); p.remove(); if (!$(".pnl")) document.body.style.overflow = ""; }, 280);
    pile = pile.filter(f => f !== fermer);
  };
  pile.push(fermer); bg.onclick = fermer; $("[data-x]", p).onclick = fermer;
  $$("[data-annuler]", p).forEach(b => b.onclick = fermer);
  if (monter) monter(p, fermer);
  return { p, fermer };
}
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && pile.length) pile[pile.length - 1](); });
function confirmer(titre, texte, libelle, danger) {
  return new Promise(res => {
    let ok = false;
    const { fermer } = ouvrir(titre, "", `<p style="margin:16px 0 0;color:var(--tx-2)">${esc(texte)}</p>`,
      `<button class="btn" data-annuler>Annuler</button><button class="btn ${danger ? "red" : "y"}" data-ok>${esc(libelle)}</button>`,
      (p, f) => { $("[data-ok]", p).onclick = () => { ok = true; f(); }; });
    const t = setInterval(() => { if (!pile.includes(fermer)) { clearInterval(t); res(ok); } }, 100);
  });
}
async function occupe(btn, fn) {
  const h = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
  try { await fn(); } catch (e) { toast(e.message || "Erreur", true); btn.disabled = false; btn.innerHTML = h; }
}

function panProgrammer(id) {

      $("#ok", p).onclick = ev => occupe(ev.currentTarget, async () => {

/* ---------- compteurs ---------- */
async function releve(e, v, date) {
  S.releves.push(await Store.ins("entretien_releves", { id: uid(), engin_id: e.id, date, valeur: v }));
  if (!e.compteur_le || date >= e.compteur_le) Object.assign(e, await Store.upd("engins", e.id, { compteur: v, compteur_le: date }));
}
function panCompteur(e) {
  const u = unite(e);
  ouvrir(e.compteur_type === "km" ? "Kilométrage" : "Heures", e.nom, `
    <div class="fl big"><label for="cV">Nouvelle valeur</label><div class="u"><input id="cV" inputmode="decimal" placeholder="${fmtN(e.compteur)}"><em>${u}</em></div>
      <div class="help mono">Précédent : ${fmtN(e.compteur)} ${u}${e.compteur_le ? " · " + fmtD(e.compteur_le, true) : ""}</div></div>
    <div class="fl"><label for="cD">Date</label><input id="cD" type="date" value="${todayISO()}"></div>`,
    PIED("Enregistrer"), (p, fermer) => {
      setTimeout(() => $("#cV", p).focus(), 300);
      $("#ok", p).onclick = ev => occupe(ev.currentTarget, async () => {
        const v = nb(val(p, "cV")); if (v == null) throw new Error("Entrez une valeur");
        if (e.compteur != null && v < +e.compteur && !(await confirmer("Valeur plus basse", `${fmtN(v)} ${u} est sous le dernier relevé (${fmtN(e.compteur)} ${u}). Compteur remplacé ?`, "Enregistrer"))) throw new Error("Annulé");
        await releve(e, v, val(p, "cD") || todayISO()); recalc(); fermer(); route(); toast("Compteur à jour");
      });
    });
}
function panReleves() {
  const l = actifs().filter(e => e.compteur_type !== "aucun").sort(sortNom);
  if (!l.length) return toast("Aucun engin avec compteur", true);
  ouvrir("Relever les compteurs", "", `
<div style="height:6px"></div>
    ${CATS.filter(c => l.some(e => e.categorie === c.id)).map(c => `<div class="cap">${ico(c.id)} ${c.pluriel}</div>${l.filter(e => e.categorie === c.id).map(e => `<div class="rl">
      <div style="min-width:0"><b>${esc(e.nom)}</b><small>${e.compteur != null ? fmtN(e.compteur) + " " + unite(e) : "jamais relevé"}${e.compteur_le ? " · " + fmtD(e.compteur_le) : ""}</small></div>
      <div class="u"><input data-r="${e.id}" inputmode="decimal" aria-label="${esc(e.nom)}"><em>${unite(e)}</em></div></div>`).join("")}`).join("")}`,
    PIED("Enregistrer"), (p, fermer) => {
      $$("[data-r]", p).forEach(i => i.oninput = () => { const e = S.engins.find(x => x.id === i.dataset.r), v = nb(i.value); i.classList.toggle("err", v != null && e.compteur != null && v < +e.compteur); });
      $("#ok", p).onclick = ev => occupe(ev.currentTarget, async () => {
        const s = $$("[data-r]", p).map(i => [S.engins.find(x => x.id === i.dataset.r), nb(i.value)]).filter(x => x[1] != null);

            S.inter.filter(i => i.engin_id === e.id).forEach(i => (i.pieces || []).forEach(x => {

              <button class="x" data-d="${k}" aria-label="Retirer">${ico("x")}</button></div>
              ${ant.map(({ x, i }) => `<div class="alert">${ico("shield")}<span><b>Sous garantie jusqu'au ${fmtD(x.garantie_fin, true)}</b> — posée le ${fmtD(i.date, true)}${i.prestataire ? " par " + esc(i.prestataire) : ""}. Faites jouer la garantie.</span></div>`).join("")}

        const pieces = pcs.map(pc => Object.assign({}, pc, { garantie_fin: +pc.garantie_mois ? E.iso(E.ajouterMois(date, +pc.garantie_mois)) : null }));
        S.inter.push(await Store.ins("entretien_interventions", { id: uid(), engin_id: e.id, plans: faits.map(x => x.id), type: faits[0] ? faits[0].type : "reparation", libelle, date, compteur: cpt,
          pieces, cout: nb(val(p, "iM")), prestataire: val(p, "iR"), notes: val(p, "iN") }));
        for (const x of faits) { if (x.derniere_date && date < x.derniere_date) continue; Object.assign(x, await Store.upd("entretien_plans", x.id, { derniere_date: date, dernier_cpt: cpt, programme_le: null, alerte_cle: null })); }
        if (cpt != null && (e.compteur == null || cpt > +e.compteur)) await releve(e, cpt, date);
        for (const pc of pieces) if (pc.article_id) { const a = S.stock.find(x => x.id === pc.article_id); if (a) Object.assign(a, await Store.upd("stock_articles", a.id, { quantite: Math.max(0, (+a.quantite || 0) - (+pc.quantite || 0)) })); }
        recalc(); fermer(); route(); toast("Entretien enregistré");
      });
    });
}

/* =============================================================================
   NOTIFICATIONS
   ============================================================================= */
function b64(s) { const p = "=".repeat((4 - s.length % 4) % 4); const r = atob((s + p).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from([...r].map(c => c.charCodeAt(0))); }
async function activerNotifs() {
  if (!("serviceWorker" in navigator) || !window.Notification) throw new Error("Notifications impossibles sur ce téléphone");
  if ((await Notification.requestPermission()) !== "granted") throw new Error("Notifications refusées dans les réglages du téléphone");
  const reg = await navigator.serviceWorker.ready;
  if (!Store.demo && "PushManager" in window) {
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(CFG.vapidPublic) });
    const j = sub.toJSON();
    await SB.q("entretien_abonnements?on_conflict=endpoint", { method: "POST", body: { endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth }, prefer: "resolution=merge-duplicates" });
  }
  localStorage.removeItem("hke_vus"); verifierAlertesLocales();
}
async function verifierAlertesLocales() {
  if (!window.Notification || Notification.permission !== "granted" || !("serviceWorker" in navigator)) return;
  let vus = {}; try { vus = JSON.parse(localStorage.getItem("hke_vus")) || {}; } catch (e) {}
  const nv = ETATS.filter(x => (x.etat.statut === "bientot" || x.etat.statut === "retard") && vus[x.plan.id] !== E.cleAlerte(x.plan, x.etat));
  if (!nv.length) return;
  nv.forEach(x => vus[x.plan.id] = E.cleAlerte(x.plan, x.etat));
  try { localStorage.setItem("hke_vus", JSON.stringify(vus)); } catch (e) {}
  const reg = await navigator.serviceWorker.ready.catch(() => null); if (!reg) return;
  const l = nv.sort(triEtat).slice(0, 4).map(x => `${x.engin.nom} : ${x.plan.libelle} ${x.etat.statut === "retard" ? "en retard" : rel(x.etat.resteJours)}`);
  reg.showNotification(nv.length > 1 ? nv.length + " entretiens à prévoir" : "Entretien à prévoir", { body: l.join("\n") + (nv.length > 4 ? "\n…" : ""), icon: "icon.png?v=2", badge: "icon.png?v=2", tag: "hke-local" });
}
function panReglages() {
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const installee = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  const dispo = !!window.Notification && "serviceWorker" in navigator;
  const perm = dispo ? Notification.permission : "indisponible";
  const etat = ios && !installee ? ["inconnu", "À activer"]
    : perm === "granted" ? ["ok", "Activées"]
    : perm === "denied" ? ["retard", "Bloquées"]
    : !dispo ? ["inconnu", "Ce navigateur ne gère pas les notifications"]
    : ["bientot", "À activer"];
  const etape = (n, t) => `<div style="display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-top:1px solid var(--line);background:var(--panel)">
      <b class="mono" style="flex:0 0 26px;height:26px;display:flex;align-items:center;justify-content:center;background:var(--yel);color:var(--yel-ink);font-size:13px">${n}</b>
      <span style="font-size:14px;line-height:1.4;padding-top:3px">${t}</span></div>`;
  ouvrir("Alertes", "", `
    <div class="svc" style="margin-top:16px">
      <div class="h" style="padding-bottom:14px"><span class="ico" style="background:var(--yel);color:var(--yel-ink);border:0">${ico("bell")}</span>
        <span class="ti"><b>Alertes d'entretien</b><small>${etat[1]}</small></span></div>
    </div>
    ${perm === "granted" && !(ios && !installee) ? `<div class="alert g" style="margin-top:12px">${ico("check")}<span>Vous serez prévenu avant chaque entretien.</span></div>`
    : ios && !installee ? `<div class="cap">Pour les activer</div>
      <div style="border:1px solid var(--line)">
        ${etape(1, "En bas de Safari, touchez <b>Partager</b> (le carré avec la flèche).")}
        ${etape(2, "Choisissez <b>Sur l'écran d'accueil</b>, puis <b>Ajouter</b>.")}
        ${etape(3, "Ouvrez <b>HK Entretiens</b> depuis la nouvelle icône, puis revenez ici et touchez <b>Activer</b>.")}
      </div>
`
    : perm === "denied" ? `<div class="alert" style="margin-top:12px">${ico("alert")}<span>Les notifications ont été refusées. Ouvrez les <b>Réglages</b> du téléphone › <b>Notifications</b> › <b>HK Entretiens</b> et autorisez-les.</span></div>`
    : dispo ? `<button class="btn y full" style="margin-top:14px" id="nOn">${ico("bell")} Activer les alertes</button>` : ""}
`, "", (p, fermer) => {
      if ($("#nOn", p)) $("#nOn", p).onclick = ev => occupe(ev.currentTarget, async () => { await activerNotifs(); fermer(); compteurs(); toast("Alertes activées"); });
    });
}
